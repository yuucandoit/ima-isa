# ═══════════════════════════════════════════════════════════════════════════
# IMA-ISA — header keamanan bersama
# Pasang di /etc/nginx/snippets/ima-isa-headers.conf
#
# Di-include ulang di setiap `location` yang memakai `add_header` sendiri
# (nginx tidak mewariskan add_header bila location mendefinisikan add_header).
# ═══════════════════════════════════════════════════════════════════════════

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Aktifkan hanya bila seluruh subdomain sudah HTTPS.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# ── Content-Security-Policy (opsional) ─────────────────────────────────────
# Dashboard memakai MapLibre GL (worker + tiles) dan Swagger UI memuat aset
# dari unpkg/jsdelivr. Uji dulu di staging sebelum mengaktifkan di produksi.
#
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; font-src 'self' data: https://unpkg.com https://cdn.jsdelivr.net; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
