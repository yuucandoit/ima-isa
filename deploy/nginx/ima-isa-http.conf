# ═══════════════════════════════════════════════════════════════════════════
# IMA-ISA — Nginx site config, HTTP saja (lokal / uji tanpa TLS)
#
# Untuk mencoba build produksi di mesin lokal atau server internal tanpa domain
# dan tanpa sertifikat. Untuk produksi ber-HTTPS pakai `ima-isa.conf`.
#
# Pasang:
#   sudo cp deploy/nginx/ima-isa-http.conf /etc/nginx/sites-available/ima-isa-http
#   sudo ln -sfn /etc/nginx/sites-available/ima-isa-http /etc/nginx/sites-enabled/ima-isa-http
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Buka http://localhost:2323 . Port 2323 dipilih karena tidak butuh root dan di
# luar rentang port sementara kernel. Ganti angka port di dua baris `listen`
# bila perlu. Pastikan API sudah jalan di 127.0.0.1:3001.
#
# Catatan keamanan: jangan pakai config ini untuk domain publik — tidak ada
# TLS, jadi password/API key dan data dashboard lewat jaringan tanpa enkripsi.
# HSTS juga sengaja tidak dikirim (tidak berlaku di HTTP).
# ═══════════════════════════════════════════════════════════════════════════

upstream ima_isa_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 2323 default_server;
    listen [::]:2323 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 15s;
    keepalive_timeout 65s;

    access_log /var/log/nginx/ima-isa-http.access.log;
    error_log  /var/log/nginx/ima-isa-http.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── SSE live feed ──────────────────────────────────────────────────────
    # Harus sebelum `location /api/` agar tidak ikut ter-buffer.
    location = /api/feeds/stream {
        proxy_pass http://ima_isa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
        gzip off;
    }

    # ── REST API ───────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://ima_isa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Executive briefing (LLM) bisa menunggu puluhan detik.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # ── Health check ───────────────────────────────────────────────────────
    location = /health {
        access_log off;
        proxy_pass http://ima_isa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # ── Swagger UI ─────────────────────────────────────────────────────────
    location /docs {
        proxy_pass http://ima_isa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # ── Aset statis ber-hash ───────────────────────────────────────────────
    location ^~ /assets/ {
        proxy_pass http://ima_isa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── SPA + fallback index.html ──────────────────────────────────────────
    location / {
        proxy_pass http://ima_isa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    # File tersembunyi tidak untuk publik.
    location ~ /\.(?!well-known) {
        deny all;
    }
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/manifest+json
    image/svg+xml;
