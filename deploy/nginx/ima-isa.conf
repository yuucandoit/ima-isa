# ═══════════════════════════════════════════════════════════════════════════
# IMA-ISA — Nginx site config (Bun API + dashboard, single origin)
#
# Pasang:
#   sudo cp deploy/nginx/ima-isa.conf         /etc/nginx/sites-available/ima-isa
#   sudo cp deploy/nginx/ima-isa-headers.conf /etc/nginx/snippets/ima-isa-headers.conf
#   sudo ln -sfn /etc/nginx/sites-available/ima-isa.conf /etc/nginx/sites-enabled/ima-isa.conf

#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ganti `intel.example.id` dengan domain asli (3 tempat: server_name, path
# sertifikat, dan nama file renewal certbot). Tested on nginx 1.18 (Ubuntu
# 22.04) dan 1.24 (Ubuntu 24.04).
# ═══════════════════════════════════════════════════════════════════════════

# Upstream Bun API — keepalive agar tidak membuka koneksi baru per request.
upstream ima_isa_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Rate limit per IP. API dilindungi lebih ketat daripada aset statis.
limit_req_zone $binary_remote_addr zone=ima_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ima_sse:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=ima_conn:10m;

# ── HTTP → HTTPS ───────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name intel.example.id;

    # Jangan buang request ACME (beberapa skenario renewal memakai port 80).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name intel.example.id;

    # Sertifikat Let's Encrypt (lihat README §4.10 untuk bootstrap certbot).
    ssl_certificate     /etc/letsencrypt/live/intel.example.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intel.example.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:IMA_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 15s;
    keepalive_timeout 65s;

    access_log /var/log/nginx/ima-isa.access.log;
    error_log  /var/log/nginx/ima-isa.error.log warn;

    include /etc/nginx/snippets/ima-isa-headers.conf;

    # ── SSE live feed ──────────────────────────────────────────────────────
    # Harus dideklarasikan sebelum `location /api/` agar tidak ikut ter-buffer.
    location = /api/feeds/stream {
        limit_req  zone=ima_sse burst=3 nodelay;
        limit_conn ima_conn 4;

        proxy_pass http://ima_isa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
        gzip off;
    }

    # ── REST API ───────────────────────────────────────────────────────────
    location /api/ {
        limit_req  zone=ima_api burst=40 nodelay;
        limit_conn ima_conn 20;

        # Endpoint demo: API sudah menolak saat NODE_ENV=production, blokir juga di edge.
        location /api/dev/ {
            return 404;
        }

        proxy_pass http://ima_isa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Executive briefing (LLM) bisa menunggu puluhan detik.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # ── Health check (dipakai monitoring / load balancer) ──────────────────
    location = /health {
        access_log off;
        proxy_pass http://ima_isa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # ── Swagger UI ─────────────────────────────────────────────────────────
    # Aset UI diambil dari CDN (unpkg/jsdelivr) oleh @elysiajs/swagger.
    location /docs {
        proxy_pass http://ima_isa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/ima-isa-headers.conf;
    }

    # ── Aset statis ber-hash (immutable, cache 1 tahun) ────────────────────
    location ^~ /assets/ {
        proxy_pass http://ima_isa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/ima-isa-headers.conf;
    }

    # ── SPA + fallback index.html (dilayani Bun via WEB_DIST) ──────────────
    location / {
        proxy_pass http://ima_isa_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 30s;

        # index.html tidak boleh di-cache agar deploy baru langsung terpakai.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/ima-isa-headers.conf;
    }

    # File tersembunyi (kecuali ACME) tidak untuk publik.
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ── Kompresi ───────────────────────────────────────────────────────────────
# Diletakkan di level http (file ini di-include dari dalam blok http).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/manifest+json
    image/svg+xml;

# Bila modul brotli tersedia (ppa:ondrej/nginx), aktifkan:
# brotli on;
# brotli_comp_level 5;
# brotli_types text/plain text/css application/javascript application/json image/svg+xml;
